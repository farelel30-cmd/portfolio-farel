<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Mascot body / head with bottom pointer -->
  <g filter="url(#shadow)">
    <!-- Main head -->
    <circle cx="50" cy="46" r="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Bottom pointer notch -->
    <polygon points="42,82 50,96 58,82" fill="#ffffff"/>
    <polyline points="42,82 50,96 58,82" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    
    <!-- Blush cheeks -->
    <ellipse cx="28" cy="54" rx="5" ry="3" fill="#f43f5e" opacity="0.3"/>
    <ellipse cx="72" cy="54" rx="5" ry="3" fill="#f43f5e" opacity="0.3"/>
    
    <!-- Friendly eyes -->
    <ellipse class="mascot-eye" cx="37" cy="42" rx="4" ry="7" fill="#0f172a"/>
    <ellipse class="mascot-eye" cx="63" cy="42" rx="4" ry="7" fill="#0f172a"/>
    
    <!-- Sparkle eye highlights -->
    <circle cx="35.5" cy="39" r="1.8" fill="#ffffff"/>
    <circle cx="61.5" cy="39" r="1.8" fill="#ffffff"/>
    
    <!-- Cute smile -->
    <path d="M 37 54 Q 50 67 63 54" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>