<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="chatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#chatBg)"/>
  <!-- Chat Window -->
  <rect x="35" y="20" width="330" height="200" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <!-- Header -->
  <rect x="35" y="20" width="330" height="38" rx="14" fill="#1e1b4b"/>
  <circle cx="58" cy="39" r="10" fill="#38bdf8"/>
  <text x="76" y="43" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Farel &amp; Friend • Online</text>
  <circle cx="340" cy="39" r="4" fill="#10b981"/>

  <!-- Chat Bubbles -->
  <!-- Incoming bubble -->
  <rect x="55" y="72" width="180" height="32" rx="10" fill="#1e293b"/>
  <text x="68" y="92" fill="#e2e8f0" font-family="sans-serif" font-size="11">Halo Rel, tugas PPLG udah?</text>

  <!-- Outgoing bubble -->
  <rect x="185" y="114" width="160" height="32" rx="10" fill="#4f46e5"/>
  <text x="198" y="134" fill="#ffffff" font-family="sans-serif" font-size="11">Udah siap nih, realtime!</text>
  <!-- Double tick -->
  <text x="325" y="136" fill="#38bdf8" font-family="sans-serif" font-size="10">✓✓</text>

  <!-- Input bar -->
  <rect x="55" y="170" width="245" height="32" rx="8" fill="#1e293b"/>
  <text x="68" y="190" fill="#64748b" font-family="sans-serif" font-size="11">Ketik pesan rahasia...</text>
  <rect x="308" y="170" width="37" height="32" rx="8" fill="#6366f1"/>
  <polygon points="320,186 332,186 326,178" fill="#ffffff" transform="rotate(90 326 186)"/>
</svg>