<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="gameBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#gameBg)"/>
  <!-- Game Frame -->
  <rect x="25" y="20" width="350" height="200" rx="14" fill="#091322" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- UKS Room Clinic Scene -->
  <!-- Floor line -->
  <line x1="25" y1="165" x2="375" y2="165" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Red Cross Badge -->
  <rect x="45" y="36" width="34" height="34" rx="8" fill="#ef4444"/>
  <rect x="58" y="42" width="8" height="22" fill="#ffffff"/>
  <rect x="51" y="49" width="22" height="8" fill="#ffffff"/>
  <text x="88" y="58" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Simulasi Petugas UKS 2D</text>

  <!-- Godot Badge -->
  <rect x="270" y="38" width="90" height="24" rx="6" fill="#478cbf"/>
  <text x="282" y="54" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">Godot 4.x</text>

  <!-- Hospital Bed / Patient -->
  <rect x="60" y="125" width="120" height="40" rx="6" fill="#1e3a8a"/>
  <circle cx="95" cy="115" r="14" fill="#fed7aa"/>
  <rect x="80" y="125" width="90" height="20" fill="#e2e8f0"/>

  <!-- Interactive Medical Tools (Thermometer, Stethoscope) -->
  <rect x="210" y="85" width="145" height="75" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="222" y="106" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Peralatan Medis:</text>
  <text x="222" y="126" fill="#e2e8f0" font-family="sans-serif" font-size="10">🌡️ Termometer: 36.8°C</text>
  <text x="222" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="10">🥗 Panduan Gizi: Normal</text>

  <!-- Game HUD / Badges -->
  <rect x="45" y="178" width="130" height="28" rx="6" fill="#047857"/>
  <text x="55" y="196" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">🏆 Badge: Healthy School</text>
  
  <rect x="190" y="178" width="165" height="28" rx="6" fill="#1d4ed8"/>
  <text x="202" y="196" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">🎮 Drag &amp; Drop System</text>
</svg>