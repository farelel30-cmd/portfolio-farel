<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#0b0f19"/>
  <rect x="25" y="20" width="350" height="200" rx="14" fill="#030712" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Video Timeline & Monitor -->
  <rect x="45" y="40" width="180" height="100" rx="6" fill="#1e1b4b"/>
  <polygon points="125,75 125,105 155,90" fill="#f43f5e"/>
  
  <!-- Effects Panel -->
  <rect x="235" y="40" width="120" height="100" rx="6" fill="#111827"/>
  <text x="245" y="60" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">Color Grading</text>
  <rect x="245" y="70" width="100" height="6" rx="3" fill="#374151"/>
  <rect x="245" y="70" width="65" height="6" rx="3" fill="#ef4444"/>
  <text x="245" y="95" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="bold">Audio Keyframes</text>
  <rect x="245" y="105" width="100" height="6" rx="3" fill="#374151"/>
  <rect x="245" y="105" width="80" height="6" rx="3" fill="#3b82f6"/>

  <!-- Timeline tracks -->
  <rect x="45" y="152" width="310" height="16" rx="4" fill="#1f2937"/>
  <rect x="65" y="154" width="80" height="12" rx="3" fill="#3b82f6"/>
  <rect x="150" y="154" width="110" height="12" rx="3" fill="#8b5cf6"/>
  <rect x="265" y="154" width="70" height="12" rx="3" fill="#10b981"/>

  <rect x="45" y="174" width="310" height="16" rx="4" fill="#1f2937"/>
  <rect x="45" y="176" width="150" height="12" rx="3" fill="#f59e0b"/>
  <rect x="200" y="176" width="130" height="12" rx="3" fill="#ef4444"/>

  <!-- Playhead line -->
  <line x1="180" y1="148" x2="180" y2="195" stroke="#ffffff" stroke-width="2"/>
  <polygon points="176,148 184,148 180,154" fill="#ffffff"/>

  <text x="45" y="210" fill="#fca5a5" font-family="sans-serif" font-weight="bold" font-size="11">Cinematic Video Editing &amp; Dynamic Motion</text>
</svg>